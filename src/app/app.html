<h1>Kurser</h1>

<table>
    <thead>
        <tr>
            <th (click)="sortByCode()">Kurskod</th>
            <th (click)="sortByName()">Kursnamn</th>
            <th (click)="sortByProgression()">Progression</th>
        </tr>
    </thead>

    <tbody>
        @for (course of courses(); track course.code) {
        <tr>
            <td>{{ course.code }}</td>
            <td>{{ course.coursename }}</td>
            <td>{{ course.progression }}</td>
        </tr>
        }
    </tbody>
</table>

<router-outlet />
