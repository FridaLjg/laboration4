<h1>Laboration 4 - DT208G</h1>

<label for="search">Sök kurs:</label>
<input type="text" id="search" placeholder="Sök efter kurs..." (input)="onSearch($event)">

<table>
    <thead>
        <tr>
            <th> <span (click)="sortByCode()">Kurskod</span></th>
            <th> <span (click)="sortByName()">Kursnamn</span></th>
            <th> <span (click)="sortByProgression()">Progression</span></th>
        </tr>
    </thead>

    <tbody>
        @for (course of filteredCourses(); track course.code) {
        <tr>
            <td>{{ course.code }}</td>
            <td>{{ course.coursename }}</td>
            <td>{{ course.progression }}</td>
        </tr>
        }
    </tbody>
</table>

<footer>Av: Frida Ljungberg, 2026</footer>

<router-outlet />
